name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build release APK
    # ubuntu-22.04 ships the Android SDK and is the image the React Native /
    # Expo toolchain is tested against. ubuntu-latest (26.04) breaks the
    # android-actions/setup-android step.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          CI: 1
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs=-Xmx3g

      - name: Rename APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} build-output/filex.apk \;
          ls -lh build-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: filex-apk
          path: build-output/filex.apk
          if-no-files-found: error
          retention-days: 90
